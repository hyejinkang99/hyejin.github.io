        caption: 2022.06 ~ 현재
        description: | # this will include new lines to allow paragraphs
            - 클라우드 인프라 제어 백엔드 개발: MSA 기반 DBaaS 플랫폼에서 멀티 테넌트 리소스 제어 API 및 프로비저닝 로직 개발
            - 인스턴스 운영 자동화: 수백 대 규모 DB 인스턴스의 생명주기 관리와 반복 운영 작업 자동화
            - 운영 안정성 개선: Kubernetes 환경의 미들웨어 HA 구성 및 트러블슈팅
            - 클라우드 서비스 개발: DBaaS 서비스 개발·고도화 및 Observability 서비스 개발 참여

  - title: Key Project # Title for the section
    layout: list # Type of content section (list/text)
    content:
      - layout: left
        title: 신규 클라우드 플랫폼 전환에 따른 미들웨어 Multi-AZ 고가용성 설계
        caption: 2025 ~ 현재
        quote: >
          가용영역(AZ) 2개·노드 3대(2:1 분산) 환경에서 Kafka·Redis의 존 장애 대응 복구 절차 설계
        description: |
          **문제 정의**

          - Kafka·Redis 모두 3개 노드를 2개 AZ에 2:1로 분산할 수밖에 없는 제약 존재
          - 과반수(쿼럼) 기반 합의 구조 특성상, 2대가 배치된 AZ 전체 장애 시 남은 1대만으로는 자동 복구 불가능한 상황을 식별

          **AZ 장애 시나리오별 복구 절차 설계**

          - 1대 배치 AZ 장애: Kafka는 KRaft voter 과반 유지로, Redis는 Sentinel 과반 유지로 자동 복구되는 경로 확인 및 변경 동결(Change Freeze) 절차 수립
          - 2대 배치 AZ 장애: 자동 복구가 불가능한 상황에서 Redis는 SENTINEL FAILOVER로 생존 노드를 Master로 수동 승격, Kafka는 생존 AZ에 신규 노드를 재구축해 쿼럼을 복원하는 단계별 절차 설계
          - 장애 AZ의 예상 복구 시간(RTO) 기준으로 원본 노드 복귀 대기와 생존 AZ 재구축 중 대응 방식을 분기하는 기준 수립

          **데이터 정합성 리스크 검토**

          - Redis 비동기 복제 특성상 발생 가능한 최근 쓰기 유실 구간을 식별하고, 승격 후 재동기화 절차로 대응
          - Kafka ISR·min.insync.replicas 조건을 명시해 쿼럼 복구 후에도 안전하게 쓰기가 재개되는 조건 정의
          - 노드 순차 복구 원칙(한 대씩 상태 확인 후 재합류)을 수립해 split-brain 및 이중 장애 확산 방지

          (현재 장애 주입 테스트를 통한 절차 검증 단계 준비 중)

      - layout: left
        title: DBaaS 서비스 개발 및 고도화
        caption: 2023.03 ~ 2023.12 / 2024.10 ~ 현재
        quote: >
          멀티 테넌트 환경에서 DB 인스턴스의 생성과 운영에 필요한 절차를 자동화하는 Database as a Service 플랫폼 개발
        description: |
          **멀티 테넌트 리소스 제어 API 개발**

          - 테넌트별 DB 인스턴스 생성 및 운영 요청을 처리하는 백엔드 API 개발
          - 클라우드 리소스 생성과 DB 설정을 연계하는 프로비저닝 로직 구현

          **DB 엔진별 프로비저닝 구조 개선**

          - Strategy 패턴을 적용해 DB 엔진별 인터페이스와 구현 로직 분리
          - 엔진별 처리 차이를 공통 인터페이스로 추상화해 기능 확장 및 유지보수 지원

          **Kubernetes 기반 운영 환경 안정화**

          - 미들웨어 고가용성 구성 및 운영 중 발생한 문제의 원인 분석·설정 개선

          **조회 성능 개선**

          - Redis 캐싱을 적용해 반복 조회에 따른 데이터베이스 접근 감소
          - JPA·Querydsl 기반 조회 쿼리 최적화

