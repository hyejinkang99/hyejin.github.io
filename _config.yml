about_content: | # this will include new lines to allow paragraphs
  Java·Spring 기반으로 클라우드 인프라 제어 및 운영 자동화 플랫폼을 개발해 온 백엔드 엔지니어입니다.


  kt cloud에서 멀티 테넌트 DBaaS 서비스의 리소스 제어 API와 프로비저닝 로직을 개발하고, 수백 대 규모의 DB 인스턴스 생명주기를 자동화하는 업무를 수행했습니다.
  DB 엔진별 동작을 분리한 <mark>확장 가능한 구조</mark>와 Kubernetes 기반 운영 환경을 다루며, <mark>서비스 안정성과 운영 효율</mark>을 개선해 왔습니다.
  최근에는 신규 클라우드 플랫폼 전환에 대응해 Kafka·Redis 등 미들웨어의 <mark>Multi-AZ 기반 장애 대응 및 복구 절차</mark>를 설계했습니다.


  인프라의 복잡한 운영 절차를 백엔드 로직으로 구현하고, 반복 작업을 자동화하는 플랫폼 개발에 강점이 있습니다.

