# about_title: About Me
about_profile_image: images/profile.jpg
about_content: | # this will include new lines to allow paragraphs
  Java·Spring 기반으로 클라우드 인프라 제어 및 운영 자동화 플랫폼을 개발해 온 백엔드 엔지니어입니다.


  kt cloud에서 멀티 테넌트 DBaaS 서비스의 리소스 제어 API와 프로비저닝 로직을 개발하고, 수백 대 규모의 DB 인스턴스 생명주기를 자동화하는 업무를 수행했습니다.
  DB 엔진별 동작을 분리한 <mark>확장 가능한 구조</mark>와 Kubernetes 기반 운영 환경을 다루며, <mark>서비스 안정성과 운영 효율</mark>을 개선해 왔습니다.
  최근에는 신규 클라우드 플랫폼 전환에 대응해 <mark>Multi-AZ 기반 고가용성 아키텍처</mark>를 설계하고, AZ 단위 장애까지 고려한 복구 자동화를 구축했습니다.


  인프라의 복잡한 운영 절차를 백엔드 로직으로 구현하고, 반복 작업을 자동화하는 플랫폼 개발에 강점이 있습니다.

content:

  - title: Experience # Title for the section
    layout: list # Type of content section (list/text)
    content:
      - layout: left
        title: kt cloud
        link: https://cloud.kt.com
        # link_text: boringcompany.com
        sub_title: 백엔드 엔지니어
        caption: 2022.06 ~ 현재
        description: | # this will include new lines to allow paragraphs
            - 클라우드 인프라 제어 백엔드 개발: MSA 기반 DBaaS 플랫폼에서 멀티 테넌트 리소스 제어 API 및 프로비저닝 로직 개발
            - 인스턴스 운영 자동화: 수백 대 규모 DB 인스턴스의 생명주기 관리와 반복 운영 작업 자동화
            - 운영 안정성 개선: Kubernetes 환경의 미들웨어 HA 구성 및 트러블슈팅
            - 클라우드 서비스 개발: DBaaS 서비스 개발·고도화 및 Observability 서비스 개발 참여

  - title: Key Project # Title for the section
    layout: list # Type of content section (list/text)
    content:
      - layout: left
        title: 신규 클라우드 플랫폼 통합 및 Multi-AZ 기반 DB 고가용성 설계
        caption: 2025 ~ 현재
        quote: >
          DBaaS의 신규 클라우드 플랫폼 지원 확대 및 AZ 장애에 대응하는 DB 클러스터 구성·복구 자동화 개발
        description: |
          **클라우드 플랫폼 통합 지원 구조 설계**

          - Strategy 패턴을 적용해 기존·신규 클라우드 플랫폼을 하나의 코드베이스에서 지원
          - 공통 비즈니스 로직과 플랫폼별 리소스 제어 구현을 분리해 플랫폼 확장 시 변경 범위 축소

          **Multi-AZ 기반 DB 클러스터 고가용성 설계**

          - DB 클러스터 노드를 2개 AZ에 분산 배치하고, 물리 서버 단위 분산 배치를 함께 적용해 장애 영향 범위 분리
          - 라우터 액티브-액티브 구성과 단일 가상 IP 기반 엔드포인트를 적용해 접속 경로 이중화

          **AZ 장애 대응 및 복구 자동화**

          - AZ 장애로 클러스터 정족수가 상실되는 상황을 탐지하고 복구를 수행하는 백그라운드 작업 개발
          - RTO 1시간 이내를 목표로 장애 탐지·복구 조건 판정·복구 실행 파이프라인 설계

      - layout: left
        title: DBaaS 서비스 개발 및 고도화
        caption: 2023.03 ~ 2023.12 / 2024.10 ~ 현재
        quote: >
          멀티 테넌트 환경에서 DB 인스턴스의 생성과 운영에 필요한 절차를 자동화하는 Database as a Service 플랫폼 개발
        description: |
          **멀티 테넌트 리소스 제어 API 개발**

          - 테넌트별 DB 인스턴스 생성 및 운영 요청을 처리하는 백엔드 API 개발
          - 클라우드 리소스 생성과 DB 설정을 연계하는 프로비저닝 로직 구현

          **DB 엔진별 프로비저닝 구조 개선**

          - Strategy 패턴을 적용해 DB 엔진별 인터페이스와 구현 로직 분리
          - 엔진별 처리 차이를 공통 인터페이스로 추상화해 기능 확장 및 유지보수 지원

          **Kubernetes 기반 운영 환경 안정화**

          - 미들웨어 고가용성 구성 및 운영 중 발생한 문제의 원인 분석·설정 개선

          **조회 성능 개선**

          - Redis 캐싱을 적용해 반복 조회에 따른 데이터베이스 접근 감소
          - JPA·Querydsl 기반 조회 쿼리 최적화

